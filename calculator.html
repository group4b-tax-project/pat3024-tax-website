<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Corporate Tax Calculator | PAT3024</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Corporate Tax Calculator</h1>

    <p>Calculate the estimated corporate tax based on chargeable income and tax rate.</p>

    <a href="index.html">Back to Homepage</a>

    <section id="calculator">

        <h2>Calculate Corporate Tax</h2>

        <label for="income">Chargeable Income (RM):</label>
        <input type="number" id="income" min="0" placeholder="Enter chargeable income">

        <br><br>

        <label for="rate">Tax Rate (%):</label>
        <input type="number" id="rate" min="0" max="100" value="24">

        <br><br>

        <button onclick="calculateTax()">Calculate Tax</button>

        <h3 id="result">Your result will appear here.</h3>

    </section>

    <script>
    function calculateTax() {

        let income = Number(document.getElementById("income").value);
        let rate = Number(document.getElementById("rate").value);

        if (
            document.getElementById("income").value === "" ||
            document.getElementById("rate").value === "" ||
            income < 0 ||
            rate < 0 ||
            rate > 100
        ) {
            document.getElementById("result").textContent =
                "Please enter valid values.";
            return;
        }

        let tax = income * rate / 100;

        document.getElementById("result").textContent =
            "Estimated Tax: RM " + tax.toLocaleString("en-MY", {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
    }
    </script>

</body>
</html>
